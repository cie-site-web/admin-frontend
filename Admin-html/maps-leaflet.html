<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta content="Admin & Dashboards Template" name="description" />
<meta content="Pixeleyez" name="author" />

<!-- layout setup -->
<script type="module" src="assets/js/layout-setup.js"></script>

<!-- App favicon -->
<link rel="shortcut icon" href="assets/images/favicon.png">

<!-- Simplebar Css -->
<link rel="stylesheet" href="assets/libs/simplebar/simplebar.min.css">
<!-- Swiper Css -->
<link href="assets/libs/swiper/swiper-bundle.min.css" rel="stylesheet">
<!-- Nouislider Css -->
<link href="assets/libs/nouislider/nouislider.min.css" rel="stylesheet">
<!-- Bootstrap Css -->
<link href="assets/css/bootstrap.min.css" id="bootstrap-style" rel="stylesheet" type="text/css">
<!--icons css-->
<link href="assets/css/icons.min.css" rel="stylesheet" type="text/css">
<!-- App Css-->
<link href="assets/css/app.min.css" id="app-style" rel="stylesheet" type="text/css">
<title>Leaflet Maps | Urbix Admin & Dashboards Template</title>
<link rel="stylesheet" href="assets/libs/leaflet/leaflet.css">
</head>
<body>

<!-- Begin page -->
<div id="layout-wrapper">

    <div data-include="partials/header.html"></div>
    <div data-include="partials/sidebar.html"></div>
    <div data-include="partials/horizontal.html"></div>

    <main class="app-wrapper">
        <div class="container-fluid">

            <div class="main-breadcrumb d-flex align-items-center my-3 position-relative">
                <h2 class="breadcrumb-title mb-0 flex-grow-1 fs-14">Leaflet Maps</h2>
                <div class="flex-shrink-0">
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb justify-content-end mb-0">
                            <li class="breadcrumb-item"><a href="javascript:void(0)">Base UI</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Leaflet Maps</li>
                        </ol>
                    </nav>
                </div>
            </div>

<div class="row">
                <div class="col-12 col-xl-6">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title mb-0">Leaflet Map</h5>
                        </div>
                        <div class="card-body">
                            <div class="w-100 min-h-320px" id="leaflet_map"></div>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-xl-6">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title mb-0">Map With Markers,circles and Polygons</h5>
                        </div>
                        <div class="card-body">
                            <div class="w-100 min-h-320px" id="leaflet_map_markers"></div>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-xl-6">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title mb-0">Map With Popup</h5>
                        </div>
                        <div class="card-body">
                            <div class="w-100 min-h-320px" id="leaflet_map_popup"></div>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-xl-6">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title mb-0">Map With Custom Icons</h5>
                        </div>
                        <div class="card-body">
                            <div class="w-100 min-h-320px" id="leaflet_map_custom_icon"></div>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-xl-6">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="card-title mb-0">Map With Custom pane</h5>
                        </div>
                        <div class="card-body">
                            <div class="w-100 min-h-320px" id="leaflet_map_custom_pane"></div>
                        </div>
                    </div>
                </div>
            </div><!--End row-->
        </div><!--End container-fluid-->
    </main><!--End app-wrapper-->

            <div data-include="partials/switcher.html"></div>
            <div data-include="partials/scroll-to-top.html"></div>
            <div data-include="partials/footer.html"></div>
        </div>
    </main>
</div>

<!-- Load reusable components BEFORE vendor scripts (synchronous XHR) -->
<script src="js/components-loader.js"></script>

<!-- JAVASCRIPT -->
<script src="assets/libs/swiper/swiper-bundle.min.js"></script>
<script src="assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="assets/libs/simplebar/simplebar.min.js"></script>
<script src="assets/js/scroll-top.init.js"></script>

<!--  Leaflet Maps plugins -->
<script src="assets/libs/leaflet/leaflet.js"></script>

<script src="assets/js/map/leaflet-map.init.js"></script>

<script src="assets/js/app.js"></script>

</body>
</html>
