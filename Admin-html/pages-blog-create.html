<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta content="Admin & Dashboards Template" name="description" />
<meta content="Pixeleyez" name="author" />

<!-- layout setup -->
<script type="module" src="assets/js/layout-setup.js"></script>

<!-- App favicon -->
<link rel="shortcut icon" href="assets/images/favicon.png">

<!-- Simplebar Css -->
<link rel="stylesheet" href="assets/libs/simplebar/simplebar.min.css">
<!-- Swiper Css -->
<link href="assets/libs/swiper/swiper-bundle.min.css" rel="stylesheet">
<!-- Nouislider Css -->
<link href="assets/libs/nouislider/nouislider.min.css" rel="stylesheet">
<!-- Bootstrap Css -->
<link href="assets/css/bootstrap.min.css" id="bootstrap-style" rel="stylesheet" type="text/css">
<!--icons css-->
<link href="assets/css/icons.min.css" rel="stylesheet" type="text/css">
<!-- App Css-->
<link href="assets/css/app.min.css" id="app-style" rel="stylesheet" type="text/css">
<title>Blog Details | Urbix Admin & Dashboards Template</title>
<!-- Editor css -->
  <link rel="stylesheet" href="assets/libs/quill/quill.snow.css">
  <!-- Select css -->
  <link rel="stylesheet" href="assets/libs/choices.js/public/assets/styles/choices.min.css">
  <!-- Uploaded css -->
  <link rel="stylesheet" href="assets/libs/dropzone/dropzone.css">
  <!-- Picker CSS -->
  <link rel="stylesheet" href="assets/libs/air-datepicker/air-datepicker.css">
</head>
<body>

<!-- Begin page -->
<div id="layout-wrapper">

    <div data-include="partials/header.html"></div>
    <div data-include="partials/sidebar.html"></div>
    <div data-include="partials/horizontal.html"></div>

    <main class="app-wrapper">
        <div class="container-fluid">

            <div class="main-breadcrumb d-flex align-items-center my-3 position-relative">
                <h2 class="breadcrumb-title mb-0 flex-grow-1 fs-14">Blog Details</h2>
                <div class="flex-shrink-0">
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb justify-content-end mb-0">
                            <li class="breadcrumb-item"><a href="javascript:void(0)">Pages</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Blog Details</li>
                        </ol>
                    </nav>
                </div>
            </div>

<div class="row">
          <div class="col-12">
            <div class="card">
              <div class="card-header">
                <h6 class="card-title">New Blog</h6>
              </div>
              <div class="card-body">
                <form action="#" method="POST">
                  <div class="row g-5">
                    <div class="col-xl-6">
                      <label for="blogTitle" class="form-label">Blog Title<span class="text-danger ms-1">*</span></label>
                      <input type="text" placeholder="Blog Title" class="form-control" id="blogTitle" required>
                    </div>
                    <div class="col-xl-6">
                      <label for="blogCategory" class="form-label">Blog Category</label>
                      <select id="default-choice">
                        <option value="python">Web Development</option>
                        <option value="javascript">Technology</option>
                        <option value="csharp">Marketing</option>
                        <option value="java">Lifestyle</option>
                        <option value="ruby">Ruby</option>
                      </select>
                    </div>
                    <div class="col-xl-6">
                      <label for="blogAuthor" class="form-label">Blog Author<span class="text-danger ms-1">*</span></label>
                      <input type="text" placeholder="Enter Name" class="form-control" id="blogAuthor" required>
                    </div>
                    <div class="col-xl-6">
                      <label for="blogTags" class="form-label">Blog Tags</label>
                      <select id="choices-default-multiple" multiple>
                        <option value="react">Social Media Marketing</option>
                        <option value="Marketing">Digital Marketing</option>
                        <option value="Business">Online Business</option>
                        <option value="Startups">Startups</option>
                      </select>
                    </div>
                    <div class="col-xl-4">
                      <label for="PublishDate" class="form-label">Publish Date</label>
                      <input type="text" class="form-control" id="human-friendly-picker" placeholder="Select a date">
                    </div>
                    <div class="col-xl-4">
                      <label for="PublishStatus" class="form-label">Publish Status</label>
                      <select id="choices-publish-status">
                        <option value="pending-review">Pending</option>
                        <option value="published">Published</option>
                        <option value="scheduled">Scheduled</option>
                      </select>
                    </div>
                    <div class="col-xl-4">
                      <label for="PublishStatus" class="form-label">Blog Visibility</label>
                      <select id="choices-blog-visibility">
                        <option value="pending-review">Public</option>
                        <option value="published">Private</option>
                        <option value="scheduled">Password Protected</option>
                      </select>
                    </div>
                    <div class="col-12">
                      <label for="BlogExcerpt" class="form-label">Blog Excerpt<span class="text-danger ms-1">*</span></label>
                      <textarea name="forsummary" id="BlogExcerpt" rows="4" class="form-control" placeholder="Write short summary..."></textarea>
                    </div>
                    <div class="col-12">
                      <label for="blogContent" class="form-label">Blog Content</label>
                      <div id="snowEditor"></div>
                    </div>
                    <div class="col-12">
                      <label for="blogImage" class="form-label">Blog Image</label>
                      <div class="file-upload dropzone " id="my-dropzone"></div>
                    </div>
                    <div class="col-12 justify-content-end d-flex gap-3 mt-6">
                      <button class="btn btn-light">Save as Draft</button>
                      <button class="btn btn-primary">Publish Blog</button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

            <div data-include="partials/switcher.html"></div>
            <div data-include="partials/scroll-to-top.html"></div>
            <div data-include="partials/footer.html"></div>
        </div>
    </main>
</div>

<!-- Load reusable components BEFORE vendor scripts (synchronous XHR) -->
<script src="js/components-loader.js"></script>

<!-- JAVASCRIPT -->
<script src="assets/libs/swiper/swiper-bundle.min.js"></script>
<script src="assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="assets/libs/simplebar/simplebar.min.js"></script>
<script src="assets/js/scroll-top.init.js"></script>

<!-- Editor js -->
  <script src="assets/libs/quill/quill.js"></script>

  <!-- Select js -->
  <script src="assets/libs/choices.js/public/assets/scripts/choices.min.js"></script>

  <!-- Uploaded js -->
  <script src="assets/libs/dropzone/dropzone-min.js"></script>

  <!-- Datepicker Js -->
  <script src="assets/libs/air-datepicker/air-datepicker.js"></script>

  <script src="assets/js/form/form-editor.init.js"></script>

  <script src="assets/js/form/file-upload.init.js"></script>

  <script src="assets/js/pages/blog-crate.init.js"></script>

  <!-- App js -->
  <script src="assets/js/app.js"></script>

</body>
</html>
